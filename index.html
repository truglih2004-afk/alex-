
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    width: max-content;
    padding: 3px;
  }

  .logo-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border-radius: 4px;
    transition: transform .2s ease;
  }

  .logo-link:hover {
    transform: translateY(-2px);
  }

  .logo-link img {
    width: 18px;
    height: 18px;
    display: block;
    object-fit: contain;
  }
</style>
</head>

<body>
<nav class="logo-row" aria-label="Quick links">

     href="https://pbs.twimg.com/profile_images/2098354893568495616/zvRJTExQ_400x400.jpg"
     target="_blank" rel="noopener noreferrer" title="Logo 1">
    <img src="https://pbs.twimg.com/profile_images/2098354893568495616/zvRJTExQ_400x400.jpg" alt="Logo 1">
  </a>
